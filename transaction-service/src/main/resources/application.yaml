spring:
  application:
    name: transaction-service

  datasource:
    url: jdbc:postgresql://localhost:5434/transactiondb
    username: transaction_user
    password: transaction_password

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8082

account-service:
  url: http://localhost:8081
